name: yunhai-daily-push

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: install-deps
        run: pip install requests matplotlib

      - name: run-predict
        env:
          WECHAT_KEY: ${{ secrets.WECHAT_KEY }}
        run: python yh.py
